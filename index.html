<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kettlebell Tracker</title>
<meta name="theme-color" content="#1C1F26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KB Tracker">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <h1>🏋️ Kettlebell Tracker</h1>
  <p>Your weekly program, at a glance</p>
</div>

<div id="view"></div>

<nav class="tabbar">
  <button data-view="week"><span class="icon">📅</span>Week</button>
  <button data-view="muscles"><span class="icon">💪</span>Muscles</button>
  <button data-view="history"><span class="icon">📈</span>History</button>
  <button data-view="more"><span class="icon">⚙️</span>More</button>
</nav>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<script src="js/muscles.js"></script>
<script src="js/seed-movements.js"></script>
<script src="js/seed-activities.js"></script>
<script src="js/seed-program.js"></script>
<script src="js/coverage.js"></script>
<script src="js/warnings.js"></script>
<script src="js/charts.js"></script>
<script src="js/history.js"></script>
<script src="js/bodymap.js"></script>
<script src="js/app.js"></script>
</body>
</html>
